<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokédex — Sinnoh Region</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Exo+2:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --slate: #1C2333;
  --slate-mid: #232D42;
  --slate-light: #2E3D5A;
  --slate-border: #3A4D6E;
  --diamond: #7EC8E3;
  --diamond-glow: #A8DDEF;
  --pearl: #E8D5F5;
  --pearl-glow: #C89FE0;
  --gold: #D4AF37;
  --gold-light: #F5D060;
  --snow: #EEF4FF;
  --ice: #C5E8F0;
  --text-main: #D8E8FF;
  --text-dim: #6A82A8;
  --text-muted: #3D5070;
  --accent-blue: #4A9FD4;
  --accent-purple: #9B59B6;
  --red: #E74C3C;
  --screen-bg: #0A1628;
  --screen-glow: #1A3A5C;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #080E1A;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 30px 10px;
  font-family: 'Exo 2', sans-serif;
  background-image:
    radial-gradient(ellipse at 30% 0%, rgba(126,200,227,0.07) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 100%, rgba(155,89,182,0.07) 0%, transparent 50%),
    url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
}

.device {
  width: 440px;
  position: relative;
}

/* Floating title */
.region-title {
  text-align: center;
  margin-bottom: 20px;
  position: relative;
}

.region-title h1 {
  font-family: 'Cinzel', serif;
  font-weight: 900;
  font-size: 11px;
  letter-spacing: 8px;
  color: var(--text-dim);
  text-transform: uppercase;
  position: relative;
}

.region-title h1::before,
.region-title h1::after {
  content: '◆';
  color: var(--diamond);
  font-size: 7px;
  margin: 0 10px;
  opacity: 0.6;
}

.region-title .sub {
  font-family: 'Cinzel', serif;
  font-size: 22px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--diamond) 0%, var(--snow) 40%, var(--pearl-glow) 70%, var(--gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 4px;
  display: block;
  margin-top: 4px;
  filter: drop-shadow(0 0 20px rgba(126,200,227,0.4));
}

/* Main card */
.pokedex-body {
  background: linear-gradient(160deg, var(--slate-mid) 0%, var(--slate) 100%);
  border-radius: 16px;
  border: 1px solid var(--slate-border);
  box-shadow:
    0 0 0 1px rgba(126,200,227,0.1),
    0 40px 100px rgba(0,0,0,0.8),
    inset 0 1px 0 rgba(126,200,227,0.15),
    inset 0 -1px 0 rgba(0,0,0,0.5);
  overflow: hidden;
  position: relative;
}

/* Diamond shimmer top bar */
.top-bar {
  height: 3px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--diamond) 20%,
    var(--snow) 50%,
    var(--pearl-glow) 80%,
    transparent 100%
  );
  animation: shimmer 4s ease-in-out infinite;
  background-size: 200% 100%;
}

@keyframes shimmer {
  0%, 100% { background-position: -100% 0; opacity: 0.7; }
  50% { background-position: 200% 0; opacity: 1; }
}

.inner-padding {
  padding: 20px;
}

/* Header with orbs */
.header-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
}

.orb-cluster {
  display: flex;
  gap: 5px;
  align-items: center;
}

.orb {
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.1);
  box-shadow: inset 0 -2px 4px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.3);
  position: relative;
  overflow: hidden;
}

.orb::after {
  content: '';
  position: absolute;
  top: 15%; left: 20%;
  width: 35%; height: 25%;
  background: rgba(255,255,255,0.5);
  border-radius: 50%;
  transform: rotate(-30deg);
}

.orb-lg {
  width: 42px; height: 42px;
  background: radial-gradient(circle at 35% 30%, var(--diamond-glow), var(--accent-blue) 50%, #0D2040);
  box-shadow: inset 0 -2px 4px rgba(0,0,0,0.4), 0 0 16px rgba(126,200,227,0.4), inset 0 1px 2px rgba(255,255,255,0.3);
  animation: orbPulse 3s ease-in-out infinite;
}

@keyframes orbPulse {
  0%,100% { box-shadow: inset 0 -2px 4px rgba(0,0,0,0.4), 0 0 10px rgba(126,200,227,0.3), inset 0 1px 2px rgba(255,255,255,0.3); }
  50% { box-shadow: inset 0 -2px 4px rgba(0,0,0,0.4), 0 0 24px rgba(126,200,227,0.7), inset 0 1px 2px rgba(255,255,255,0.3); }
}

.orb-sm { width: 12px; height: 12px; }
.orb-diamond { background: radial-gradient(circle at 35% 30%, var(--diamond-glow), var(--accent-blue)); }
.orb-pearl { background: radial-gradient(circle at 35% 30%, var(--pearl), var(--pearl-glow)); }
.orb-gold { background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold)); }

.header-text {
  flex: 1;
}

.device-label {
  font-family: 'Cinzel', serif;
  font-size: 7px;
  letter-spacing: 3px;
  color: var(--text-muted);
  text-transform: uppercase;
  display: block;
}

.device-model {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 2px;
}

/* MAIN SCREEN */
.screen-frame {
  background: #050E1A;
  border-radius: 10px;
  padding: 3px;
  border: 1px solid var(--slate-border);
  box-shadow:
    0 0 0 1px rgba(126,200,227,0.08),
    inset 0 2px 12px rgba(0,0,0,0.9);
  margin-bottom: 16px;
  position: relative;
}

.screen-frame::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: 11px;
  background: linear-gradient(135deg, rgba(126,200,227,0.2) 0%, transparent 40%, rgba(155,89,182,0.15) 100%);
  pointer-events: none;
}

.screen {
  background: var(--screen-bg);
  border-radius: 8px;
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* Subtle grid overlay */
.screen::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(126,200,227,0.03) 19px, rgba(126,200,227,0.03) 20px),
    repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(126,200,227,0.03) 19px, rgba(126,200,227,0.03) 20px);
  pointer-events: none;
  z-index: 1;
}

.screen-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  width: 100%;
  padding: 16px;
  position: relative;
  z-index: 2;
}

.sprite-wrap {
  position: relative;
  width: 96px;
  height: 96px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sprite-glow {
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(126,200,227,0.25) 0%, transparent 70%);
  animation: glowPulse 2.5s ease-in-out infinite;
}

@keyframes glowPulse {
  0%,100% { opacity: 0.6; transform: scale(0.9); }
  50% { opacity: 1; transform: scale(1.1); }
}

.poke-sprite {
  width: 96px;
  height: 96px;
  image-rendering: pixelated;
  position: relative;
  z-index: 2;
  transition: opacity 0.3s, transform 0.3s;
  filter: drop-shadow(0 0 8px rgba(126,200,227,0.5));
}

.poke-sprite.loading { opacity: 0; transform: scale(0.85) translateY(5px); }

.screen-num {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  color: var(--text-muted);
  letter-spacing: 2px;
  margin-top: 6px;
}

.screen-name {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  font-weight: 700;
  color: var(--diamond);
  letter-spacing: 2px;
  text-shadow: 0 0 12px rgba(126,200,227,0.6);
  margin-top: 3px;
}

.idle-state {
  text-align: center;
}

.idle-diamond {
  font-size: 32px;
  color: var(--diamond);
  opacity: 0.2;
  display: block;
  margin-bottom: 10px;
  animation: idleSpin 8s linear infinite;
}

@keyframes idleSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.idle-text {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  color: var(--text-muted);
  letter-spacing: 3px;
}

/* INFO PANEL */
.info-panel {
  background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.02) 100%);
  border: 1px solid var(--slate-border);
  border-radius: 10px;
  padding: 14px 16px;
  min-height: 130px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}

.info-panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--diamond), transparent);
  opacity: 0.4;
}

.info-name-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}

.info-pokemon-name {
  font-family: 'Cinzel', serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--snow);
  letter-spacing: 1px;
}

.info-pokemon-id {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  color: var(--text-muted);
  letter-spacing: 2px;
}

.types-row {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.type-pill {
  padding: 3px 12px;
  border-radius: 20px;
  font-family: 'Exo 2', sans-serif;
  font-size: 9px;
  font-weight: 600;
  color: rgba(255,255,255,0.95);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  border: 1px solid rgba(255,255,255,0.15);
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 10px;
}

.stat-cell {
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--slate-border);
  border-radius: 6px;
  padding: 6px 8px;
  text-align: center;
}

.stat-lbl {
  font-family: 'Exo 2', sans-serif;
  font-size: 7px;
  font-weight: 300;
  color: var(--text-muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  display: block;
  margin-bottom: 2px;
}

.stat-val {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--diamond);
}

.hw-row {
  display: flex;
  gap: 12px;
  margin-bottom: 8px;
}

.hw-item {
  font-size: 10px;
  color: var(--text-dim);
  font-weight: 300;
  letter-spacing: 0.5px;
}

.hw-item span {
  color: var(--text-muted);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-right: 4px;
}

.poke-desc {
  font-size: 11px;
  color: var(--text-dim);
  line-height: 1.6;
  font-weight: 300;
  border-top: 1px solid var(--slate-border);
  padding-top: 8px;
}

.placeholder-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding-top: 20px;
}

.placeholder-info p {
  font-family: 'Cinzel', serif;
  font-size: 9px;
  color: var(--text-muted);
  letter-spacing: 3px;
  text-align: center;
  line-height: 2.5;
}

/* CONTROLS ROW */
.controls-row {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 14px;
}

/* D-Pad */
.dpad {
  display: grid;
  grid-template-columns: repeat(3, 28px);
  grid-template-rows: repeat(3, 28px);
  gap: 2px;
  flex-shrink: 0;
}

.dpad-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--slate-border);
  border-radius: 5px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 10px;
  transition: all 0.1s;
  outline: none;
}

.dpad-btn:hover { background: rgba(126,200,227,0.1); color: var(--diamond); border-color: var(--diamond); }
.dpad-btn:active { background: rgba(126,200,227,0.2); transform: scale(0.92); }
.dpad-center { background: rgba(255,255,255,0.03); cursor: default; font-size: 4px; color: var(--text-muted); letter-spacing: 0.5px; font-family: 'Exo 2', sans-serif; }
.dpad-empty { background: transparent; border: none; pointer-events: none; }

.right-controls {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.search-input {
  width: 100%;
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--slate-border);
  border-radius: 8px;
  padding: 9px 14px;
  color: var(--diamond);
  font-family: 'Exo 2', sans-serif;
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 1px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.search-input::placeholder { color: var(--text-muted); }
.search-input:focus {
  border-color: rgba(126,200,227,0.4);
  box-shadow: 0 0 0 2px rgba(126,200,227,0.08), 0 0 12px rgba(126,200,227,0.1);
}

.btn-group {
  display: flex;
  gap: 6px;
}

.ctrl-btn {
  flex: 1;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--slate-border);
  border-radius: 7px;
  padding: 8px 4px;
  color: var(--text-dim);
  font-family: 'Exo 2', sans-serif;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
  outline: none;
}

.ctrl-btn:hover { background: rgba(126,200,227,0.08); border-color: rgba(126,200,227,0.3); color: var(--diamond); }
.ctrl-btn:active { transform: scale(0.96); }
.ctrl-btn.catch-btn:hover { background: rgba(212,175,55,0.1); border-color: rgba(212,175,55,0.4); color: var(--gold); }

/* POKEMON LIST */
.list-container {
  background: rgba(0,0,0,0.35);
  border: 1px solid var(--slate-border);
  border-radius: 10px;
  overflow: hidden;
}

.list-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 14px;
  border-bottom: 1px solid var(--slate-border);
  background: rgba(0,0,0,0.2);
}

.list-title {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  color: var(--text-muted);
  letter-spacing: 3px;
  text-transform: uppercase;
}

.list-counter {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  color: var(--diamond);
  letter-spacing: 1px;
}

.poke-list {
  height: 170px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--slate-border) transparent;
}

.poke-list::-webkit-scrollbar { width: 3px; }
.poke-list::-webkit-scrollbar-track { background: transparent; }
.poke-list::-webkit-scrollbar-thumb { background: var(--slate-border); border-radius: 2px; }

.poke-row {
  display: flex;
  align-items: center;
  padding: 5px 14px;
  gap: 10px;
  cursor: pointer;
  transition: all 0.15s;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  position: relative;
}

.poke-row::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 0;
  background: var(--diamond);
  transition: width 0.15s;
}

.poke-row:hover { background: rgba(126,200,227,0.05); }
.poke-row:hover::before { width: 2px; }
.poke-row.active { background: rgba(126,200,227,0.1); }
.poke-row.active::before { width: 2px; }

.row-num {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  color: var(--text-muted);
  width: 32px;
  flex-shrink: 0;
  letter-spacing: 0.5px;
}

.row-thumb {
  width: 30px;
  height: 30px;
  image-rendering: pixelated;
  flex-shrink: 0;
}

.row-name {
  font-family: 'Exo 2', sans-serif;
  font-size: 11px;
  font-weight: 400;
  color: var(--text-dim);
  flex: 1;
  letter-spacing: 0.5px;
}

.poke-row.active .row-name { color: var(--snow); }

.row-types {
  display: flex;
  gap: 3px;
}

.mini-pill {
  padding: 1px 6px;
  border-radius: 10px;
  font-size: 7px;
  font-family: 'Exo 2', sans-serif;
  font-weight: 600;
  color: rgba(255,255,255,0.9);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border: 1px solid rgba(255,255,255,0.1);
}

.row-caught {
  font-size: 10px;
  width: 14px;
  text-align: center;
  color: var(--text-muted);
}

.row-caught.yes { color: var(--diamond); }

/* Bottom indicator dots */
.bottom-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 14px 0 2px;
}

.ind-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text-muted);
  opacity: 0.3;
  transition: all 0.3s;
}

.ind-dot.active {
  background: var(--diamond);
  opacity: 1;
  box-shadow: 0 0 6px var(--diamond);
}

.ind-line {
  height: 1px;
  flex: 1;
  background: linear-gradient(90deg, transparent, var(--slate-border), transparent);
}

/* TYPE COLORS */
.t-normal { background: rgba(168,168,120,0.7); }
.t-fire { background: rgba(240,128,48,0.8); }
.t-water { background: rgba(104,144,240,0.8); }
.t-electric { background: rgba(248,208,48,0.8); color: #333 !important; }
.t-grass { background: rgba(120,200,80,0.8); }
.t-ice { background: rgba(152,216,216,0.8); color: #1a3a3a !important; }
.t-fighting { background: rgba(192,48,40,0.8); }
.t-poison { background: rgba(160,64,160,0.8); }
.t-ground { background: rgba(224,192,104,0.8); color: #333 !important; }
.t-flying { background: rgba(168,144,240,0.8); }
.t-psychic { background: rgba(248,88,136,0.8); }
.t-bug { background: rgba(168,184,32,0.8); }
.t-rock { background: rgba(184,160,56,0.8); }
.t-ghost { background: rgba(112,88,152,0.8); }
.t-dragon { background: rgba(112,56,248,0.8); }
.t-dark { background: rgba(112,88,72,0.8); }
.t-steel { background: rgba(184,184,208,0.8); color: #1a1a2a !important; }
</style>
</head>
<body>

<div class="device">
  <div class="region-title">
    <h1>National Pokédex</h1>
    <span class="sub">SINNOH</span>
  </div>

  <div class="pokedex-body">
    <div class="top-bar"></div>
    <div class="inner-padding">

      <div class="header-row">
        <div class="orb-cluster">
          <div class="orb orb-lg"></div>
          <div style="display:flex;flex-direction:column;gap:4px;margin-left:2px;">
            <div class="orb orb-sm orb-diamond"></div>
            <div class="orb orb-sm orb-pearl"></div>
            <div class="orb orb-sm orb-gold"></div>
          </div>
        </div>
        <div class="header-text">
          <span class="device-label">Pokétch Systems Inc.</span>
          <span class="device-model">POKÉDEX DP — REV 2.0</span>
        </div>
      </div>

      <!-- SCREEN -->
      <div class="screen-frame">
        <div class="screen">
          <div class="screen-content" id="screenContent">
            <div class="idle-state">
              <span class="idle-diamond">◆</span>
              <div class="idle-text">SELECT POKÉMON</div>
            </div>
          </div>
        </div>
      </div>

      <!-- INFO PANEL -->
      <div class="info-panel" id="infoPanel">
        <div class="placeholder-info">
          <p>CHOOSE A POKÉMON<br>TO VIEW DATA</p>
        </div>
      </div>

      <!-- CONTROLS -->
      <div class="controls-row">
        <div class="dpad">

  {id:491,name:"Darkrai",types:["dark"],hp:70,atk:90,def:90,desc:"It chases people and Pokémon away from its territory by causing them to experience deep, nightmarish slumbers.",height:"1.5m",weight:"50.5kg"},
  {id:492,name:"Shaymin",types:["grass"],hp:100,atk:100,def:100,desc:"It can dissolve toxins in the air to instantly transform ruined land into a lush field of flowers.",height:"0.2m",weight:"2.1kg"},
  {id:493,name:"Arceus",types:["normal"],hp:120,atk:120,def:120,desc:"It is described in mythology as the Pokémon that shaped the universe with its 1,000 arms.",height:"3.2m",weight:"320.0kg"},
];

const TYPE_COLORS = {
  normal:'rgba(168,168,120,0.75)',fire:'rgba(240,128,48,0.85)',water:'rgba(104,144,240,0.85)',
  electric:'rgba(248,208,48,0.85)',grass:'rgba(120,200,80,0.85)',ice:'rgba(152,216,216,0.85)',
  fighting:'rgba(192,48,40,0.85)',poison:'rgba(160,64,160,0.85)',ground:'rgba(224,192,104,0.85)',
  flying:'rgba(168,144,240,0.85)',psychic:'rgba(248,88,136,0.85)',bug:'rgba(168,184,32,0.85)',
  rock:'rgba(184,160,56,0.85)',ghost:'rgba(112,88,152,0.85)',dragon:'rgba(112,56,248,0.85)',
  dark:'rgba(112,88,72,0.85)',steel:'rgba(184,184,208,0.85)'
};

let currentIdx = -1;
let filtered = [...SINNOH];
let caught = new Set(JSON.parse(localStorage.getItem('sinnoh_caught') || '[]'));
let showCaughtOnly = false;

function save() { localStorage.setItem('sinnoh_caught', JSON.stringify([...caught])); }

function updateCounter() {
  document.getElementById('cntDisplay').textContent = `${caught.size} / ${SINNOH.length} caught`;
}

function spriteUrl(id) {
  return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
}

function typePill(t, mini = false) {
  const cls = mini ? 'mini-pill' : 'type-pill';
  return `<span class="${cls} t-${t}" style="background:${TYPE_COLORS[t]}">${t.toUpperCase()}</span>`;
}

function renderList() {
  const list = document.getElementById('pokeList');
  list.innerHTML = '';
  filtered.forEach(p => {
    const isActive = currentIdx >= 0 && SINNOH[currentIdx]?.id === p.id;
    const isCaught = caught.has(p.id);
    const row = document.createElement('div');
    row.className = 'poke-row' + (isActive ? ' active' : '');
    row.innerHTML = `
      <span class="row-num">#${String(p.id).padStart(3,'0')}</span>
      <img class="row-thumb" src="${spriteUrl(p.id)}" alt="${p.name}" loading="lazy" />
      <span class="row-name">${p.name}</span>
      <div class="row-types">${p.types.map(t => typePill(t, true)).join('')}</div>
      <span class="row-caught ${isCaught ? 'yes' : ''}">${isCaught ? '◆' : '◇'}</span>
    `;
    row.onclick = () => selectPokemon(SINNOH.indexOf(p));
    list.appendChild(row);
  });
}

function selectPokemon(idx) {
  if (idx < 0 || idx >= SINNOH.length) return;
  currentIdx = idx;
  const p = SINNOH[idx];

  // Screen
  const sc = document.getElementById('screenContent');
  sc.innerHTML = `
    <div class="sprite-wrap">
      <div class="sprite-glow"></div>
      <img class="poke-sprite loading" id="spr" src="${spriteUrl(p.id)}" alt="${p.name}" />
    </div>
    <div class="screen-num">No. ${String(p.id).padStart(3,'0')}</div>
    <div class="screen-name">${p.name.toUpperCase()}</div>
  `;
  const spr = document.getElementById('spr');
  spr.onload = () => spr.classList.remove('loading');

  // Info
  const panel = document.getElementById('infoPanel');
  panel.innerHTML = `
    <div class="info-name-row">
      <div class="info-pokemon-name">${p.name}</div>
      <div class="info-pokemon-id">No. ${String(p.id).padStart(3,'0')}</div>
    </div>
    <div class="types-row">${p.types.map(t => typePill(t)).join('')}</div>
    <div class="stats-grid">
      <div class="stat-cell"><span class="stat-lbl">HP</span><span class="stat-val">${p.hp}</span></div>
      <div class="stat-cell"><span class="stat-lbl">Attack</span><span class="stat-val">${p.atk}</span></div>
      <div class="stat-cell"><span class="stat-lbl">Defense</span><span class="stat-val">${p.def}</span></div>
    </div>
    <div class="hw-row">
      <div class="hw-item"><span>HT</span>${p.height}</div>
      <div class="hw-item"><span>WT</span>${p.weight}</div>
    </div>
    <div class="poke-desc">${p.desc}</div>
  `;

  renderList();
  updateCounter();

  const activeRow = document.querySelector('.poke-row.active');
  if (activeRow) activeRow.scrollIntoView({ block: 'nearest' });
}

function navigate(delta) {
  if (!filtered.length) return;
  if (currentIdx < 0) { selectPokemon(SINNOH.indexOf(filtered[0])); return; }
  const curId = SINNOH[currentIdx]?.id;
  const pos = filtered.findIndex(p => p.id === curId);
  const newPos = Math.max(0, Math.min(filtered.length - 1, pos + delta));
  selectPokemon(SINNOH.indexOf(filtered[newPos]));
}

function onSearch() {
  const q = document.getElementById('searchBox').value.toLowerCase().trim();
  showCaughtOnly = false;
  if (!q) { filtered = [...SINNOH]; }
  else {
    filtered = SINNOH.filter(p =>
      p.name.toLowerCase().includes(q) ||
      String(p.id).includes(q) ||
      p.types.some(t => t.includes(q))
    );
  }
  renderList();
}

function doRandom() {
  filtered = [...SINNOH];
  document.getElementById('searchBox').value = '';
  showCaughtOnly = false;
  selectPokemon(Math.floor(Math.random() * SINNOH.length));
}

function toggleCatch() {
  if (currentIdx < 0) return;
  const id = SINNOH[currentIdx].id;
  caught.has(id) ? caught.delete(id) : caught.add(id);
  save();
  updateCounter();
  renderList();
}

function toggleCaughtView() {
  showCaughtOnly = !showCaughtOnly;
  document.getElementById('searchBox').value = '';
  filtered = showCaughtOnly ? SINNOH.filter(p => caught.has(p.id)) : [...SINNOH];
  renderList();
}

renderList();
updateCounter();
</script>
</body>
</html>
